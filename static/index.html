<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1>ClipForge</h1><p>Local video studio · No watermark · No paid API required</p></header>
<main><section><h2>Your projects</h2><label id="drop">Upload or drop a video<input type="file" id="upload" accept="video/*"></label><p id="status" role="status" aria-live="polite"></p><div id="projects"></div></section>
<section id="studio" hidden><h2 id="title"></h2><video id="video" controls></video><div class="controls"><label>Start (seconds)<input id="start" type="number" min="0" step="0.01" value="0"></label><label>End (seconds)<input id="end" type="number" min="0" step="0.01"></label><button id="markStart">Use current time as start</button><button id="markEnd">Use current time as end</button><button id="preview">Preview selection</button></div>
<div class="controls"><label><input id="vertical" type="checkbox" checked> Vertical 9:16</label><label><input id="captions" type="checkbox"> Burn in captions</label><button id="export">Export MP4</button></div><div id="exports"></div>
<h3>Local analysis</h3><p>Whisper transcription is optional. Suggestions use explainable heuristics, not semantic understanding. Review context before export.</p><div class="controls"><label>Processing mode<select id="mode"><option value="fast">Fast</option><option value="balanced" selected>Balanced</option><option value="quality">Maximum quality</option></select></label><label><input id="consent" type="checkbox"> Allow download of the selected model</label><button id="analyze">Analyze full video</button></div><p id="modelInfo"></p><div id="suggestions"></div><details><summary>Transcript</summary><div id="transcript"></div></details></section>
<section><h2>Storage and diagnostics</h2><button id="diagnose">Run diagnostics</button><button id="storage">Refresh storage</button><pre id="report"></pre></section></main><script src="/static/app.js"></script></body></html>
